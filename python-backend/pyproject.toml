[project]
name = "graphboard-backend"
version = "0.1.0"
description = "Graphboard FastAPI backend replacing Convex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "langgraph>=1.2.9",
  "black>=26.5.1",
  "google-genai>=0.1.0",
  "pgvector>=0.5.0",
  "tiktoken>=0.13.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "pyyaml>=6.0.1",
  "instructor>=1.7.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.uv]
managed = true

[dependency-groups]
dev = [
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  "types-setuptools",
  "types-pyyaml",
  "pytest",
  "pytest-asyncio",
  "pytest-mock>=3.15.1",
  "aiosqlite>=0.22.1",
]
